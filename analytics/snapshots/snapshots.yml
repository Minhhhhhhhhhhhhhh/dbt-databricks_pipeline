
snapshots:
  - name: job_postings_snapshot
    relation: ref('stg_job_posting_current')
    description: >
      Snapshot of the current job postings, capturing the latest state of each job posting
      based on the search_date and search_time. This snapshot allows for tracking changes
      in job postings over time.
    config:
      target_schema: snapshots
      strategy: check
      unique_key: job_id
      check_cols: 
        - job_title
        - company_name
        - job_location
        - job_schedule_type
        - job_work_from_home
        - salary_min
        - salary_max
        - salary_period
        - salary_currency
        - has_health_insurance
        - has_dental_insurance
        - has_paid_time_off
        - has_no_degree_mentioned
      updated_at: search_time

